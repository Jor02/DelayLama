name: Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate placeholder bitmap assets
        run: python extract_assets.py --placeholder --output assets

      - name: Configure CMake
        run: cmake --preset vs2022 

      - name: Build
        run: cmake --build --preset vs2022 --target DelayLamaTests

      - name: Run tests
        run: ctest --test-dir build/vs2022 --output-on-failure

      - name: Configure CMake (64-bit)
        run: cmake --preset vs2022-x64

      - name: Build (64-bit)
        run: cmake --build --preset vs2022-x64 --target DelayLamaTests

      - name: Run tests (64-bit)
        run: ctest --test-dir build/vs2022-x64 --output-on-failure

      - name: Show test failures
        if: failure()
        shell: pwsh
        run: |
          Get-Content build/vs2022*/Testing/Temporary/LastTest.log -ErrorAction SilentlyContinue |
            Select-String -Pattern 'Failure|expected|Expected|Which is|differ|NaN|FAILED' |
            Select-Object -First 30 |
            ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: build/vs2022*/Testing/Temporary/LastTest.log